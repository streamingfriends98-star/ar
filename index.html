<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071322"><title>Portal — Camera Carousel</title><link rel="stylesheet" href="carousel.css?v=1"></head><body><video id="camera" autoplay muted playsinline></video><div class="shade"></div><header><span class="brand">PORTAL / IMAGE COLLECTION</span><p id="status" role="status">Opening camera…</p><button id="start" hidden>Start camera</button></header><main><section id="carousel" tabindex="0" aria-roledescription="carousel" aria-label="Five image collection"><div class="frame"><img id="photo" draggable="false" alt=""><div id="missing" hidden>Image unavailable. Swipe to continue.</div></div><div class="caption"><span id="title"></span><span id="count" aria-live="polite"></span></div></section><nav aria-label="Carousel controls"><button id="prev" aria-label="Previous image">‹</button><div id="dots"></div><button id="next" aria-label="Next image">›</button></nav><p class="instruction">Swipe left or right to explore</p></main><footer><button id="fit">Image: fit</button><button id="full">Fullscreen</button><details><summary>Device info</summary><span id="device"></span></details><small>Live camera overlay · no marker required</small></footer><script src="slides.js?v=1"></script><script src="carousel.js?v=1"></script></body></html>
